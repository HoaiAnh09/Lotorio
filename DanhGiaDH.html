<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đánh giá đơn hàng - Lotorio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;700&display=swap" rel="stylesheet">
    <style>
        html, body {
            height: 100%;
            margin: 0;
        }
        body {
            font-family: 'Baloo2', sans-serif;
            background: #fffbe6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .flex-container {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        #footer-placeholder {
            width: 100%;
        }
        .custom-yellow {
            background-color: #ffd000;
            color: #1a1a1a;
        }
        .custom-yellow-text {
            color: #ffd000;
        }
        .star {
            font-size: 2.5rem;
            cursor: pointer;
            color: #ccc;
            transition: color 0.2s;
        }
        .star.selected {
            color: #ffd000;
        }
        .like-btn, .dislike-btn {
            border: 2px solid #ffd000;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin: 0 6px;
            font-size: 1.5rem;
            cursor: pointer;
            background: #fff;
            transition: background 0.2s, color 0.2s;
        }
        .like-btn.selected, .dislike-btn.selected {
            background: #ffd000;
            color: #1a1a1a;
        }
        .container {
            max-width: 95%;
            margin: 0 auto;
            padding: 30px;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
            z-index: 10000;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .modal:not(.hidden) {
            display: flex;
            opacity: 1;
        }
        .modal-content {
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            transform: translateY(-20px);
            transition: transform 0.3s ease;
        }
        .modal:not(.hidden) .modal-content {
            transform: translateY(0);
        }
        .modal-btn {
            background: #ffd000;
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            font-size: 1.1rem;
            margin-top: 20px;
        }
            </style>
</head>
<body>
    <main class="flex-container">
        <div id="nav-placeholder"></div>
        <div class="container flex gap-10">
            <!-- Danh sách món -->
            <div class="flex-1">
                <div class="bg-[#fff9c4] rounded-xl p-6 mb-6 text-center font-bold text-xl">Bạn có hài lòng với món?</div>
                <div id="dish-list" class="bg-white rounded-xl p-6 shadow-md"></div>
            </div>
            <!-- Đánh giá tổng thể -->
            <div class="w-[450px]">
                <div class="bg-[#fff9c4] rounded-xl p-6 shadow-md">
                    <div class="font-bold text-xl mb-3" id="store-name">Lotorio - Tây Sơn</div>
                    <div id="star-rating" class="mb-3 flex gap-2"></div>
                    <textarea id="review-text" rows="8" class="w-full rounded p-3 mt-3 border border-gray-300 focus:outline-none focus:ring-2 focus:ring-yellow-400" placeholder="Nhập nhận xét..."></textarea>
                    <label class="flex items-center mt-3 cursor-pointer">
                        <input type="checkbox" id="anonymous" class="mr-2 h-5 w-5"> Ẩn danh đánh giá của tôi
                    </label>
                    <label class="flex items-center mt-3 cursor-pointer gap-3 text-sm">
                        <input type="file" id="img-upload" class="hidden" accept="image/*">
                        <span class="inline-flex items-center px-3 py-1 bg-white border border-yellow-400 rounded cursor-pointer">
                            <svg width="18" height="18" fill="#ffd000" viewBox="0 0 24 24">
                                <path d="M12 16.5l4-4h-3V7.5h-2v5H8l4 4z" />
                            </svg>
                            <span class="ml-1">Thêm ảnh</span>
                        </span>
                        <span id="img-preview" class="text-gray-600"></span>
                    </label>
                    <button id="submit-btn" class="w-full mt-6 py-3 rounded custom-yellow font-bold text-xl hover:bg-yellow-500">Gửi</button>
                </div>
            </div>
        </div>
        <!-- Modal thông báo đánh giá thành công -->
        <div id="success-modal" class="fixed inset-0 bg-black bg-opacity-40 hidden flex items-center justify-center z-50">
            <div class="modal-content">
                <button id="close-modal" class="absolute top-3 right-3 text-2xl font-bold text-gray-400 hover:text-red-500">&times;</button>
                <h2 class="text-3xl font-bold text-green-600 mb-4"> ✅Đánh giá đơn hàng thành công!</h2>
                <p>Cảm ơn bạn đã đánh giá đơn hàng tại Lotorio.</p>
                <button id="go-to-orders" class="px-4 py-2 text-base rounded-md bg-yellow-400 hover:bg-yellow-300 text-black font-semibold mt-4">Xem đơn hàng</button>
            </div>
        </div>
        <div id="footer-placeholder"></div>
    </main>

    <script>
        // Load nav & footer
        fetch('nav.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('nav-placeholder').innerHTML = data;
                const path = window.location.pathname.split('/').pop();
                const navLinks = document.querySelectorAll('#nav-placeholder nav a');
                navLinks.forEach(link => {
                    if (link.getAttribute('href') === path) {
                        link.classList.add('font-bold', 'text-yellow-400');
                    } else {
                        link.classList.remove('font-bold', 'text-yellow-400');
                    }
                });
            })
            .catch(error => console.error('Error loading nav:', error));

        fetch('footer.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('footer-placeholder').innerHTML = data;
            })
            .catch(error => console.error('Error loading footer:', error));

        // Lấy id đơn hàng từ URL
        function getOrderId() {
            const params = new URLSearchParams(window.location.search);
            return params.get('id');
        }

        // Lấy dữ liệu đơn hàng từ localStorage
        function getOrderData(orderId) {
            const orders = JSON.parse(localStorage.getItem('orders') || '[]');
            return orders.find(o => String(o.id) === orderId);
        }

        // Cập nhật trạng thái đơn hàng
        function updateOrderStatus(orderId, newStatus) {
            const orders = JSON.parse(localStorage.getItem('orders') || '[]');
            const orderIndex = orders.findIndex(o => String(o.id) === orderId);
            if (orderIndex !== -1) {
                orders[orderIndex].status = newStatus;
                localStorage.setItem('orders', JSON.stringify(orders));
                console.log(`Order ${orderId} updated to status: ${newStatus}`);
            } else {
                console.error(`Order ${orderId} not found for status update`);
            }
        }

        // Render danh sách món ăn
        function renderDishes(order) {
            const dishList = document.getElementById('dish-list');
            dishList.innerHTML = '';
            if (!order.items || order.items.length === 0) {
                dishList.innerHTML = '<div class="text-red-500 text-center text-lg">Không có món nào trong đơn hàng!</div>';
                return;
            }
            order.items.forEach((item, idx) => {
                dishList.innerHTML += `
                    <div class="flex items-center justify-between border-b py-4">
                        <div class="flex items-center gap-6">
                            <img src="${item.image || 'https://via.placeholder.com/80'}" alt="${item.name}" class="w-20 h-20 rounded object-cover">
                            <div>
                                <div class="font-bold text-lg">${item.name}</div>
                                <div class="text-gray-500 text-base">${item.price.toLocaleString()} đ</div>
                            </div>
                        </div>
                        <div>
                            <button class="dislike-btn" data-idx="${idx}" title="Không hài lòng">👎</button>
                            <button class="like-btn" data-idx="${idx}" title="Hài lòng">👍</button>
                        </div>
                    </div>
                `;
            });
        }

        // Xử lý like/dislike từng món
        function handleDishFeedback() {
            document.querySelectorAll('.like-btn, .dislike-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const idx = this.getAttribute('data-idx');
                    const isLike = this.classList.contains('like-btn');
                    this.parentNode.querySelectorAll('button').forEach(b => b.classList.remove('selected'));
                    this.classList.add('selected');
                    dishFeedback[idx] = isLike ? 'like' : 'dislike';
                });
            });
        }

        // Render rating sao
        function renderStars(rating) {
            const starDiv = document.getElementById('star-rating');
            starDiv.innerHTML = '';
            for (let i = 1; i <= 5; i++) {
                const star = document.createElement('span');
                star.className = 'star' + (i <= rating ? ' selected' : '');
                star.innerHTML = '★';
                star.addEventListener('click', () => {
                    renderStars(i);
                    overallRating.value = i;
                });
                starDiv.appendChild(star);
            }
        }

        // Xử lý upload ảnh và đánh giá
        document.addEventListener('DOMContentLoaded', function() {
            const orderId = getOrderId();
            const dishList = document.getElementById('dish-list');
            if (!orderId) {
                dishList.innerHTML = '<div class="text-red-500 text-center text-lg">Không tìm thấy ID đơn hàng!</div>';
                console.error('Order ID not found in URL');
                return;
            }
            const order = getOrderData(orderId);
            if (!order) {
                dishList.innerHTML = '<div class="text-red-500 text-center text-lg">Không tìm thấy đơn hàng!</div>';
                console.error('Order not found in localStorage for ID:', orderId);
                return;
            }
            document.getElementById('store-name').textContent = order.store || 'Lotorio - Tây Sơn';
            renderDishes(order);
            handleDishFeedback();

            // Sao
            window.overallRating = { value: 0 };
            renderStars(0);

            // Ảnh preview
            document.getElementById('img-upload').addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(evt) {
                        document.getElementById('img-preview').innerHTML = `<img src="${evt.target.result}" class="w-16 h-16 inline-block rounded ml-3 object-cover">`;
                    };
                    reader.readAsDataURL(file);
                }
            });

            // Gắn sự kiện cho nút "Xem đơn hàng"
            const goToOrdersBtn = document.getElementById('go-to-orders');
            if (goToOrdersBtn) {
                goToOrdersBtn.addEventListener('click', function() {
                    window.location.href = 'DonHang.html';
                });
            } else {
                console.error('Element with ID "go-to-orders" not found');
            }

            // Gửi đánh giá
            const submitBtn = document.getElementById('submit-btn');
            if (submitBtn) {
                submitBtn.addEventListener('click', function() {
                    try {
                        if (overallRating.value === 0) {
                            alert('Vui lòng chọn số sao đánh giá!');
                            return;
                        }
                        const review = {
                            orderId,
                            store: order.store || 'Lotorio - Tây Sơn',
                            rating: overallRating.value,
                            comment: document.getElementById('review-text').value,
                            anonymous: document.getElementById('anonymous').checked,
                            dishFeedback,
                            timestamp: new Date().toLocaleString()
                        };
                        const reviews = JSON.parse(localStorage.getItem('reviews') || '[]');
                        reviews.push(review);
                        localStorage.setItem('reviews', JSON.stringify(reviews));
                        // Cập nhật trạng thái đơn hàng
                        if (order.status !== 'hoan-thanh') {
                            updateOrderStatus(orderId, 'hoan-thanh');
                        }
                        // Hiển thị modal
                        const successModal = document.getElementById('success-modal');
                        if (successModal) {
                            successModal.classList.remove('hidden');
                            console.log('Modal displayed successfully');
                        } else {
                            console.error('Element with ID "success-modal" not found');
                        }
                    } catch (error) {
                        console.error('Error submitting review:', error);
                        alert('Đã xảy ra lỗi khi gửi đánh giá. Vui lòng thử lại!');
                    }
                });
            } else {
                console.error('Element with ID "submit-btn" not found');
            }
        });

        // Biến lưu feedback từng món
        let dishFeedback = {};
        document.getElementById('close-modal')?.addEventListener('click', function() {
            window.location.href = 'DonHang.html';
            });
    </script>
</body>
</html>
