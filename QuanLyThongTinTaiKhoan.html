<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lotorio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Baloo:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.2.1/flowbite.min.css" rel="stylesheet" />

    <style>
        body {
            font-family: 'Baloo', sans-serif;
        }
        .hero-bg {
            background: url('https://via.placeholder.com/1920x600') no-repeat center/cover;
            background-color: #1a1a1a;
        }
        .custom-yellow {
            background-color: #FFD700;
            color: #1a1a1a;
        }
        .custom-yellow-text {
            color: #FFD700;
        }
        .discount-circle {
            background: radial-gradient(circle, #ff0000, #ff5555);
            border-radius: 50%;
        }
    </style>

</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.2.1/flowbite.min.js"></script>

<body class="bg-white ">
    <div id="nav-placeholder"></div>
    <div class="flex items-center justify-center px-6 py-10">
    <div class="max-w-5xl w-full border border-blue-500 rounded-xl overflow-hidden flex shadow-md">
    <div class="w-1/4 bg-white p-6 flex flex-col items-center border-r border-blue-500">
      <div class="w-28 h-28 rounded-full border border-black mb-20 flex items-center justify-center text-sm">Avatar</div>
      <p class="mb-5 font-semibold">Nguyễn Văn A</p>
      <button class="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600">Đăng xuất</button>
    </div>

    <!-- Nội dung chính -->
    <div class="w-3/4 p-6">
      <h2 class="text-2xl font-bold text-center mb-4">Thông tin tài khoản</h2>
      <hr class="mb-6">

      <form class="space-y-4 max-w-lg">
        <div><p class="font-Baloo mb-2">Thông tin cá nhân</p>
</div>
        <div>
          <p class="font-Baloo 2 mb-1">Họ tên</p>
          <input type="text" value="Nguyễn Văn A" class="w-full border rounded px-4 py-2" />
        </div>
        <div>
          <p class="font-Baloo 2 mb-1">Số điện thoại</p>
          <input type="text" value="09XXXXXXXX" class="w-full border rounded px-4 py-2" />
        </div>
        <div>
          <p class="font-Baloo 2 mb-1">Email</p>
          <input type="email" value="XXX@Gmail.com" class="w-full border rounded px-4 py-2" />
        </div>
        <div>
          <p class="font-Baloo 2 mb-1">Địa chỉ</p>
          <input type="text" value="175 Tây Sơn ,Đống Đa, Hà Nội" class="w-full border rounded px-4 py-2" />
        </div>
        <div class="flex items-center justify-between">
          <div class="w-full">
            <p class="font-Baloo 2 mb-1">Mật khẩu</p>
            <input type="password" value="*********" class="w-full border rounded px-4 py-2" />
          </div>
          <a href="#" class="text-blue-500 text-sm ml-4 whitespace-nowrap">Đổi mật khẩu</a>
        </div>

        <div class="text-right pt-4">
  <button id="saveButton" type="button" class="bg-yellow-400 hover:bg-yellow-500 text-black px-4 py-2 rounded font-semibold">
    Lưu thông tin
  </button>
</div>
        <!-- Overlay nền xám -->
<div id="successOverlay" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
  <!-- Modal hộp trắng -->
  <div class="bg-white rounded-2xl shadow-xl px-8 py-6 text-center w-[400px]">
    <div class="flex items-center justify-center mb-4">
      <svg class="w-12 h-12 text-green-500" fill="currentColor" viewBox="0 0 20 20">
        <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414L8.414 15l-4.121-4.121a1 1 0 111.414-1.414L8.414 12.172l7.879-7.879a1 1 0 011.414 0z" clip-rule="evenodd" />
      </svg>
      <h2 class="text-2xl font-bold ml-2">Lưu thông tin thành công</h2>
    </div>
    <button id="confirmButton" class="bg-yellow-400 hover:bg-yellow-500 text-black px-6 py-2 rounded font-semibold mt-4">
      Đồng ý
    </button>
  </div>
</div>
      </form>
    </div>
  </div>
</body>
<script>
        // Load nav and footer using fetch
        fetch('nav.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('nav-placeholder').innerHTML = data;
            })
            .catch(error => console.error('Error loading nav:', error));

        fetch('footer.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('footer-placeholder').innerHTML = data;
            })
            .catch(error => console.error('Error loading footer:', error));
    
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                document.querySelector(this.getAttribute('href')).scrollIntoView({
                    behavior: 'smooth'
                });
            });
        });
    </script>
    <script>
  const saveBtn = document.getElementById("saveButton");
  const overlay = document.getElementById("successOverlay");
  const confirmBtn = document.getElementById("confirmButton");

  saveBtn.addEventListener("click", function (e) {
    e.preventDefault(); // Ngăn submit nếu trong form
    overlay.classList.remove("hidden"); // Hiện overlay
  });

  confirmBtn.addEventListener("click", function () {
    overlay.classList.add("hidden"); // Ẩn overlay khi nhấn "Đồng ý"
  });
</script>
</html>
