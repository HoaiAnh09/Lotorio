<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lotorio - Đặt tiệc</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Baloo:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    body {  font-family: 'Baloo', sans-serif; }
    .custom-yellow { background-color: #FFD700; color: #1a1a1a; }
    .custom-yellow-text { color: #FFD700; }
    .combo-img { width: 180px; height: 120px; object-fit: cover; border-radius: 16px; }
    .combo-card { background: #fff; border-radius: 16px; box-shadow: 0 2px 8px #0001; padding: 24px 12px; text-align: center; }
    .qty-btn { width: 32px; height: 32px; border-radius: 50%; background: #eee; font-size: 1.5rem; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
    .qty-btn:active { background: #FFD700; color: #1a1a1a; }

  </style>
</head>
<body class="bg-white min-h-screen flex flex-col">
  <!-- Navigation -->
  <div id="nav-placeholder"></div>

 <!-- Nội dung chính -->
<div class="max-w-6xl mx-auto px-2 py-4">

  <!-- Nút quay lại: đặt TRÊN phần lưới -->
  <div class="mb-4">
    <button onclick="window.location.href='ThongTinTiec.html'" class="text-black-600 hover:underline text-xl font-bold">
      ← Thông tin bàn tiệc
    </button>
  </div>
<!-- Grid hai cột -->
  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <!-- Trái: danh sách món -->
    <div>
      <div id="danhSachMon" class="space-y-4"></div>
      <div class="mt-4">
        <label class="font-bold block mb-1">Ghi chú</label>
        <div id="ghiChu" class="w-full border rounded p-2 bg-white"></div>
      </div>
    </div>

    <div class="flex flex-col gap-4 self-start text-[17px] leading-relaxed">
  <div class="bg-gray-100 p-4 rounded shadow">
    <h3 class="font-bold text-xl mb-2">Thời gian tổ chức:</h3>
    <p id="ngayGio" class="mb-1"></p>
    <p><strong>Cửa hàng:</strong> <span id="coSo"></span></p>
    <h3 class="font-bold text-xl mt-4 mb-1">Thông tin người đặt:</h3>
    <p><strong>Họ tên:</strong> <span id="hoTen"></span></p>
    <p><strong>SĐT:</strong> <span id="sdt"></span></p>
  </div>

  <div class="bg-yellow-400 p-4 rounded text-xl font-bold flex justify-between">
    <span>Tổng tiền:</span>
    <span id="tongTienHienThi">0 ₫</span>
  </div>

  <div class="flex items-center gap-4">
    <img id="qrImage" src="" class="w-28 h-28" alt="QR">
    <div class="text-base font-medium">
      <p><strong>Số tài khoản:</strong> 686868686868</p>
      <p><strong>Ngân hàng:</strong> Techcombank</p>
      <p><strong>Người nhận:</strong> LOTORIO</p>
      <p><strong>Nội dung:</strong> <span id="qrNoiDung"></span></p>
    </div>
  </div>

<button id="btnHoanTat" class="w-full bg-yellow-400 hover:bg-yellow-500 text-black text-xl font-bold py-3 rounded-full transition duration-300 shadow-md hover:shadow-lg flex items-center justify-center gap-2">
   Hoàn tất
</button>
</div>
</div>
</div>


 
<!-- Modal thông báo đặt tiệc thành công -->
<div id="success-modal" class="fixed inset-0 bg-black bg-opacity-40 hidden flex items-center justify-center z-50">
  <div class="bg-white p-6 rounded-xl shadow-lg text-center max-w-lg w-full relative">
    <button id="close-modal" class="absolute top-3 right-3 text-2xl font-bold text-gray-400 hover:text-red-500">&times;</button>
    <h2 class="text-3xl font-bold text-green-600 mb-4">✅ Đặt tiệc thành công!</h2>
    <p class="text-lg text-gray-700 mb-5">Cảm ơn bạn đã đặt tiệc tại <strong>Lotorio</strong>. Chúng tôi sẽ liên hệ xác nhận trong thời gian sớm nhất.</p>
    <button id="go-to-orders" class="mt-4 px-6 py-3 bg-yellow-400 hover:bg-yellow-300 text-black font-semibold rounded-lg text-lg">
      Về trang chủ
    </button>
  </div>
</div>
  
  <!-- Footer -->
  <div id="footer-placeholder"></div>

  <script>
    // Load nav + footer
    fetch('nav.html')
      .then(res => res.text())
      .then(data => {
        document.getElementById('nav-placeholder').innerHTML = data;
        const path = window.location.pathname.split('/').pop();
        const navLinks = document.querySelectorAll('#nav-placeholder nav a');
        navLinks.forEach(link => {
          if (link.getAttribute('href') === path) {
            link.classList.add('font-bold', 'custom-yellow-text');
          }
        });
      });

    fetch('footer.html')
      .then(res => res.text())
      .then(data => {
        document.getElementById('footer-placeholder').innerHTML = data;
      });

    // Hiển thị thông tin
    const info = JSON.parse(localStorage.getItem('thongTinTiec') || '{}');
    const combos = JSON.parse(localStorage.getItem('selectedCombos') || '[]');
    const cart = JSON.parse(localStorage.getItem('cart') || '[]');

    document.getElementById('hoTen').innerText = info.hoTen || '';
    document.getElementById('sdt').innerText = info.sdt || '';
    document.getElementById('ghiChu').innerText = info.ghiChu || '';
    document.getElementById('ngayGio').innerText = `${info.gio || ''} ${info.ngay || ''}`;
    document.getElementById('coSo').innerText = info.coSo || '';

    const danhSachMon = document.getElementById('danhSachMon');
    let tongTien = 0;

    combos.forEach(combo => {
      let comboHTML = `<div class="border rounded p-3 shadow"><h3 class="font-bold mb-2">${combo.name} (x${combo.quantity})</h3>`;
      combo.items.forEach(item => {
        const itemTotal = item.price * item.quantity * combo.quantity;
        tongTien += itemTotal;
        comboHTML += `
          <div class="flex items-center gap-3 mb-2">
            <img src="${item.img}" alt="${item.name}" class="w-16 h-16 object-cover rounded">
            <div>
              <div class="font-semibold">${item.name}</div>
              <div>Số lượng mỗi set: ${item.quantity}</div>
              <div>Giá mỗi món: ${item.price.toLocaleString()} đ</div>
              <div class="text-yellow-600 font-bold">Tổng: ${itemTotal.toLocaleString()} đ</div>
            </div>
          </div>`;
      });
      comboHTML += `</div>`;
      danhSachMon.innerHTML += comboHTML;
    });

    if (cart.length > 0) {
      let cartHTML = `<div class="border rounded p-3 shadow"><h3 class="font-bold mb-2">Món gọi thêm</h3>`;
      cart.forEach(item => {
        const itemTotal = item.qty * item.price;
        tongTien += itemTotal;
        cartHTML += `
          <div class="flex items-center gap-3 mb-2">
            <img src="${item.image}" alt="${item.name}" class="w-16 h-16 object-cover rounded">
            <div>
              <div class="font-semibold">${item.name}</div>
              <div>SL: ${item.qty} | Đơn giá: ${item.price.toLocaleString()} đ</div>
              <div class="text-yellow-600 font-bold">Tổng: ${itemTotal.toLocaleString()} đ</div>
            </div>
          </div>`;
      });
      cartHTML += `</div>`;
      danhSachMon.innerHTML += cartHTML;
    }

    document.getElementById('tongTienHienThi').innerText = `${tongTien.toLocaleString()} ₫`;
    localStorage.setItem('tongTien', tongTien);

    const noiDung = `thanh toan tiec ${info.hoTen || 'abc'}`;
    document.getElementById('qrNoiDung').innerText = noiDung;
    document.getElementById('qrImage').src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(noiDung)}`;

    document.getElementById('btnHoanTat').addEventListener('click', function () {
  document.getElementById('success-modal').classList.remove('hidden');
});

// Gắn sự kiện cho nút trong modal
document.getElementById('go-to-orders').addEventListener('click', function () {
  window.location.href = 'TrangChu.html'; // Hoặc thay bằng trang đơn hàng
});

document.getElementById('close-modal')?.addEventListener('click', function() {
  window.location.href = 'DatTiec.html';
});

  </script>
</body>
</html>
