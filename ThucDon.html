<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lotorio - Thực đơn</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Baloo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Baloo', sans-serif;
        }
        .custom-yellow {
            background-color: #FFD700;
            color: #1a1a1a;
        }
        .custom-yellow-text {
            color: #FFD700;
        }
        .sidebar-btn {
            padding: 10px;
            margin-bottom: 10px;
            border: none;
            background: #eee;
            cursor: pointer;
            text-align: left;
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
            transition: background 0.2s, font-weight 0.2s, color 0.2s;
        }
        .sidebar-btn.active {
            background: #ffd000;
            font-weight: bold;
            color: #1a1a1a;
        }
        .menu-item {
            background-color: #f7f7f7;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 10px;
            display: none; /* Ẩn mặc định, sẽ hiển thị khi lọc */
        }
        .menu-item.active {
            display: block;
        }
    </style>
</head>
<body class="bg-white">
    <!-- Navigation will be injected here -->
    <div id="nav-placeholder"></div>

    <!-- Main Content -->
    <main class="max-w-6xl mx-auto px-4 py-12 flex">
        <!-- Sidebar -->
        <aside class="sidebar w-1/5 pr-4 flex flex-col">
            <button class="sidebar-btn active" data-category="all">Tất cả</button>
            <button class="sidebar-btn" data-category="ga-ran">Gà rán</button>
            <button class="sidebar-btn" data-category="mi-com">Mỳ ý/Cơm</button>
            <button class="sidebar-btn" data-category="burger">Burger</button>
            <button class="sidebar-btn" data-category="do-uong">Đồ uống</button>
            <button class="sidebar-btn" data-category="mon-trang-mieng">Món tráng miệng</button>
        </aside>

        <!-- Menu Items -->
        <section class="w-4/5">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4" id="menu-items">
                <!-- Mì/Com -->
                <div class="menu-item" data-category="mi-com">
                    <img src="img/Com-ga-gion.jpg" alt="Cơm Gà Giòn" class="mx-auto mb-2">
                    <p class="font-semibold">Cơm Gà Giòn</p>
                    <p class="text-yellow-600">49.000đ</p>
                    <button class="custom-yellow text-black py-1 px-2 rounded">+</button>
                </div>
                <div class="menu-item" data-category="mi-com">
                    <img src="img/Com-ga-cay.jpg" alt="Cơm Gà Sốt Cay" class="mx-auto mb-2">
                    <p class="font-semibold">Cơm Gà Sốt Cay</p>
                    <p class="text-yellow-600">69.000đ</p>
                    <button class="custom-yellow text-black py-1 px-2 rounded">+</button>
                </div>
                <div class="menu-item" data-category="mi-com">
                    <img src="img/Com-ga-nuoc.jpg" alt="Cơm Gà Cay + Nước" class="mx-auto mb-2">
                    <p class="font-semibold">Cơm Gà Cay + Nước</p>
                    <p class="text-yellow-600">69.000đ</p>
                    <button class="custom-yellow text-black py-1 px-2 rounded">+</button>
                </div>

                <!-- Burger -->
                <div class="menu-item" data-category="burger">
                    <img src="img/Burger-ga.jpg" alt="Burger Gà" class="mx-auto mb-2">
                    <p class="font-semibold">Burger Gà</p>
                    <p class="text-yellow-600">45.000đ</p>
                    <button class="custom-yellow text-black py-1 px-2 rounded">+</button>
                </div>

                <!-- Đồ uống -->
                <div class="menu-item" data-category="do-uong">
                    <img src="img/pepsi.jpg" alt="Pepsi" class="mx-auto mb-2">
                    <p class="font-semibold">Pepsi</p>
                    <p class="text-yellow-600">15.000đ</p>
                    <button class="custom-yellow text-black py-1 px-2 rounded">+</button>
                </div>
                <div class="menu-item" data-category="do-uong">
                    <img src="img/cola.jpg" alt="Coca" class="mx-auto mb-2">
                    <p class="font-semibold">Coca</p>
                    <p class="text-yellow-600">15.000đ</p>
                    <button class="custom-yellow text-black py-1 px-2 rounded">+</button>
                </div>

                <!-- Gà rán -->
                <div class="menu-item" data-category="ga-ran">
                    <img src="img/Ga-Khoai.jpg" alt="Combo Gà Khoai" class="mx-auto mb-2">
                    <p class="font-semibold">Combo Gà Khoai</p>
                    <p class="text-yellow-600">99.000đ</p>
                    <button class="custom-yellow text-black py-1 px-2 rounded">+</button>
                </div>
                <div class="menu-item" data-category="ga-ran">
                    <img src="img/ga-ran.jpg" alt="Gà Rán Giòn" class="mx-auto mb-2">
                    <p class="font-semibold">Gà Rán Giòn</p>
                    <p class="text-yellow-600">39.000đ</p>
                    <button class="custom-yellow text-black py-1 px-2 rounded">+</button>
                </div>
                <div class="menu-item" data-category="ga-ran">
                    <img src="img/ga-cay.jpg" alt="Gà Rán Sốt Cay" class="mx-auto mb-2">
                    <p class="font-semibold">Gà Rán Sốt Cay</p>
                    <p class="text-yellow-600">39.000đ</p>
                    <button class="custom-yellow text-black py-1 px-2 rounded">+</button>
                </div>

                <div class="menu-item" data-category="mon-trang-mieng">
                    <img src="img/kem-vani.jpg" alt="Kem" class="mx-auto mb-2">
                    <p class="font-semibold">Kem Vani</p>
                    <p class="text-yellow-600">10.000đ</p>
                    <button class="custom-yellow text-black py-1 px-2 rounded">+</button>
                </div>
            </div>
        </section>
    </main>

    <!-- Footer will be injected here -->
    <div id="footer-placeholder"></div>
<script>
        // Load nav and footer using fetch
        fetch('nav.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('nav-placeholder').innerHTML = data;

        // Đánh dấu nav hiện tại
        const path = window.location.pathname.split('/').pop();
        const navLinks = document.querySelectorAll('#nav-placeholder nav a');
        navLinks.forEach(link => {
            if (link.getAttribute('href') === path) {
                link.classList.add('font-bold', 'custom-yellow-text');
            } else {
                link.classList.remove('font-bold', 'custom-yellow-text');
            }
        });
    });

        fetch('footer.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('footer-placeholder').innerHTML = data;
            })
            .catch(error => console.error('Error loading footer:', error));

        // Filter menu items based on sidebar selection
        document.querySelectorAll('.sidebar-btn').forEach(button => {
            button.addEventListener('click', () => {
                // Remove active class from all buttons
                document.querySelectorAll('.sidebar-btn').forEach(btn => btn.classList.remove('active'));
                // Add active class to clicked button
                button.classList.add('active');

                const category = button.getAttribute('data-category');
                const menuItems = document.querySelectorAll('.menu-item');

                menuItems.forEach(item => {
                    const itemCategory = item.getAttribute('data-category');
                    if (category === 'all' || itemCategory === category) {
                        item.classList.add('active');
                    } else {
                        item.classList.remove('active');
                    }
                });
            });
        });

        // Set default to show all items on page load
        document.querySelectorAll('.menu-item').forEach(item => item.classList.add('active'));

        // === Cart logic ===
        let cart = JSON.parse(localStorage.getItem('cart') || '[]');
        
        function renderCart() {
    const cartItems = document.getElementById('cart-items');
    const cartTotal = document.getElementById('cart-total');
    cartItems.innerHTML = '';
    let total = 0;

    cart.forEach((item, idx) => {
        total += item.price * item.qty;
        cartItems.innerHTML += `
            <li class="flex justify-between items-center mb-4 border-b pb-2">
                <img src="${item.image}" alt="${item.name}" class="w-16 h-16 object-cover rounded mr-3">
                <div class="flex-1">
                    <p class="font-semibold">${item.name}</p>
                    <div class="flex items-center mt-1">
                        <button onclick="changeQty(${idx}, -1)" class="custom-yellow text-black py-1 px-2 rounded">−</button>
                        <span class="mx-2">${item.qty}</span>
                        <button onclick="changeQty(${idx}, 1)" class="custom-yellow text-black py-1 px-2 rounded">+</button>
                    </div>
                </div>
                <div class="text-right">
                    <p class="whitespace-nowrap">${item.price * item.qty}đ</p>
                    <button onclick="removeFromCart(${idx})" class="text-red-500 text-sm mt-1">🗑️</button>
                </div>
            </li>
        `;
    });

    cartTotal.textContent = total + 'đ';
}
        function changeQty(index, delta) {
    if (cart[index]) {
        cart[index].qty += delta;
        if (cart[index].qty <= 0) {
            cart.splice(index, 1);
        }
        localStorage.setItem('cart', JSON.stringify(cart));
        renderCart();
    }
}

        function addToCart(name, price, image) {
            const found = cart.find(item => item.name === name);
            if (found) {
                found.qty += 1;
            } else {
                cart.push({ name, price, qty: 1, image });
            }
            localStorage.setItem('cart', JSON.stringify(cart));
            renderCart();
            document.getElementById('cart-sidebar').classList.remove('hidden');
        }

        function removeFromCart(idx) {
            cart.splice(idx, 1);
            localStorage.setItem('cart', JSON.stringify(cart));
            renderCart();
        }

        function toggleCart() {
            document.getElementById('cart-sidebar').classList.toggle('hidden');
        }

        // Gán sự kiện cho nút "+"
        document.querySelectorAll('.menu-item').forEach(item => {
            const btn = item.querySelector('button');
            btn.addEventListener('click', () => {
                const name = item.querySelector('p.font-semibold').textContent;
                const price = parseInt(item.querySelector('.text-yellow-600').textContent.replace(/\D/g, ''));
                const image = item.querySelector('img').getAttribute('src');
                addToCart(name, price, image);
            });
        });
        document.querySelector('#cart-sidebar a[href="DatHang.html"]').addEventListener('click', function() {
            localStorage.setItem('cart', JSON.stringify(cart));
        });
    </script>
</body>
</html>
